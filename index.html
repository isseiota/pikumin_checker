<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIKUMIN CHECKER</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 認証画面 -->
    <div id="authContainer" class="auth-container">
      <div class="auth-box">
        <h1>PIKUMIN CHECKER</h1>
        
        <!-- ログインフォーム -->
        <div id="loginSection" class="auth-section">
          <h2>ログイン</h2>
          <form id="loginForm">
            <div class="form-group">
              <label for="loginUsername">ユーザー名</label>
              <input id="loginUsername" type="text" placeholder="ユーザー名" required />
            </div>
            <div class="form-group">
              <label for="loginPassword">パスワード</label>
              <input id="loginPassword" type="password" placeholder="パスワード" required />
            </div>
            <button type="submit" class="auth-button">ログイン</button>
          </form>
          <p class="auth-toggle">
            まだアカウントがない場合は
            <button type="button" id="toggleToRegister" class="link-button">登録</button>
          </p>
        </div>

        <!-- 登録フォーム -->
        <div id="registerSection" class="auth-section is-hidden">
          <h2>新規登録</h2>
          <form id="registerForm">
            <div class="form-group">
              <label for="registerUsername">ユーザー名</label>
              <input id="registerUsername" type="text" placeholder="ユーザー名" required />
            </div>
            <div class="form-group">
              <label for="registerPassword">パスワード</label>
              <input id="registerPassword" type="password" placeholder="パスワード" required />
            </div>
            <button type="submit" class="auth-button">登録</button>
          </form>
          <p class="auth-toggle">
            既にアカウントをお持ちの場合は
            <button type="button" id="toggleToLogin" class="link-button">ログイン</button>
          </p>
        </div>

        <div id="authError" class="error-message is-hidden"></div>
      </div>
    </div>

    <!-- アプリメイン画面 -->
    <div id="appContainer" class="is-hidden">
      <div class="bg-shape bg-shape-a"></div>
      <div class="bg-shape bg-shape-b"></div>

      <main class="app-shell">
      <header class="hero">
        <div class="hero-top">
          <p class="eyebrow">Pikmin Bloom Collection</p>
          <button id="logoutBtn" type="button" class="secondary">ログアウト</button>
        </div>
        <h1>PIKUMIN CHECKER</h1>
        <p class="subtitle">集めたピクミンの種類をチェックして、コンプリート状況をひと目で確認。</p>
      </header>

      <section class="controls card">
        <label class="field">
          <span>検索</span>
          <input id="searchInput" type="text" placeholder="種類名で検索" />
        </label>

        <label class="field">
          <span>色フィルタ</span>
          <select id="colorFilter">
            <option value="all">すべて</option>
            <option value="赤">赤ピクミン</option>
            <option value="黄">黄ピクミン</option>
            <option value="青">青ピクミン</option>
            <option value="紫">紫ピクミン</option>
            <option value="白">白ピクミン</option>
            <option value="羽">羽ピクミン</option>
            <option value="岩">岩ピクミン</option>
          </select>
        </label>


        <div class="actions">
          <button id="addItemBtn" type="button">＋ 項目を追加</button>
        </div>
      </section>

      <section class="stats card">
        <div class="stat">
          <span class="label">収集数</span>
          <span class="value" id="collectedCount">0</span>
        </div>
        <div class="stat">
          <span class="label">総種類数</span>
          <span class="value" id="totalCount">0</span>
        </div>
        <div class="stat">
          <span class="label">達成率</span>
          <span class="value" id="completionRate">0%</span>
        </div>
        <div class="progress-wrap">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </section>

      <section class="card">
        <h2>種類リスト</h2>
        <p id="emptyState" class="empty-state" hidden>条件に一致する種類がありません。</p>
        <div id="pikminList" class="pikmin-groups"></div>
      </section>

    </main>

    <dialog id="itemDialog" class="seedling-dialog">
      <div class="dialog-header">
        <h3 id="itemDialogTitle">項目</h3>
        <button id="closeItemDialogBtn" type="button" class="dialog-close">閉じる</button>
      </div>
      <p id="itemDialogNote" class="dialog-note">この項目のチェックを変更できます。</p>
      <div id="itemDialogCheckboxes" class="seedling-checkboxes"></div>
      <div class="confirm-actions">
        <button id="deleteItemBtn" type="button" class="danger">項目削除</button>
      </div>
    </dialog>

    <dialog id="addItemDialog" class="seedling-dialog">
      <div class="dialog-header">
        <h3>項目を追加</h3>
        <button id="closeAddItemDialogBtn" type="button" class="dialog-close">閉じる</button>
      </div>
      <div class="add-item-form">
        <label class="field">
          <span>カテゴリ</span>
          <select id="addItemGroup"></select>
        </label>
        <label class="field is-hidden" id="addItemGroupNewField">
          <span>新規カテゴリ名</span>
          <input id="addItemGroupNew" type="text" placeholder="例: 名所" maxlength="50" />
        </label>
        <label class="field is-hidden" id="addItemLineSelectField">
          <span>路線</span>
          <select id="addItemLineSelect"></select>
        </label>
        <label class="field is-hidden" id="addItemLineField">
          <span>新規路線名</span>
          <input id="addItemLine" type="text" placeholder="例: テスト線" maxlength="50" />
        </label>
        <label class="field">
          <span id="addItemNameLabel">項目名</span>
          <input id="addItemName" type="text" placeholder="例: テスト橋" maxlength="50" />
        </label>
        <p id="addItemError" class="error-message is-hidden"></p>
      </div>
      <div class="confirm-actions">
        <button id="cancelAddItemBtn" type="button" class="secondary">キャンセル</button>
        <button id="confirmAddItemBtn" type="button">追加する</button>
      </div>
    </dialog>

    </div><!-- appContainer end -->

    <script src="joyo-kanji.js"></script>
    <script src="app.js"></script>
  </body>
</html>
